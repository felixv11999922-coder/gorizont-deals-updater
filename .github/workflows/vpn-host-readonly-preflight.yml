name: Read-only spare host networking and eligibility
on:
  push:
    branches: [experiment/vless-connectivity-audit]
    paths: [.github/workflows/vpn-host-readonly-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Read only VM OS, privilege and network egress
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          port="${VPS_PORT:-22}"
          ssh-keyscan -T 8 -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -p "$port" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "RUNS_AS_ROOT=$([ "$(id -u)" -eq 0 ] && echo true || echo false)"
          . /etc/os-release
          echo "OS_VERSION=${VERSION_ID:-unknown}"
          if command -v curl >/dev/null 2>&1; then
            code="$(curl -fsSL --max-time 8 'https://ipapi.co/country/' 2>/dev/null | tr -d '\r\n' | head -c 2 || true)"
            if [[ "$code" =~ ^[A-Z]{2}$ ]]; then echo "GEO_COUNTRY=$code"; else echo 'GEO_COUNTRY=unknown'; fi
            if curl -fsSL --max-time 8 https://api.github.com >/dev/null 2>&1; then echo 'GITHUB_EGRESS=true'; else echo 'GITHUB_EGRESS=false'; fi
            if curl -fsSL --max-time 8 https://acme-v02.api.letsencrypt.org/directory >/dev/null 2>&1; then echo 'ACME_EGRESS=true'; else echo 'ACME_EGRESS=false'; fi
          fi
          if command -v ufw >/dev/null 2>&1; then
            echo "UFW_STATUS=$(ufw status | head -n 1 | tr -d '\r')"
          else
            echo "UFW_STATUS=not_installed"
          fi
          for bin in python3 curl apt-get systemctl docker podman; do
            if command -v "$bin" >/dev/null 2>&1; then echo "HAS_${bin//-/_}=true"; else echo "HAS_${bin//-/_}=false"; fi
          done
          echo "READ_ONLY_NETWORK_PREFLIGHT=true"
          REMOTE
